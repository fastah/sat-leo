<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Starlink - IX and PoPs</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiczhtYXRodXIiLCJhIjoiY21wam16YWkyMWhnZjJwczJpc3AwMW1jbSJ9.BvWu_mlnoW2ngIEGEPqv-w';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/standard',
            config: {
                basemap: {
                    showPedestrianRoads: false,
                    showPointOfInterestLabels: false,
                    showRoadLabels: false,
                    showTransitLabels: false,
                    show3dObjects: false,
                    show3dBuildings: false,
                    show3dTrees: false,
                    show3dLandmarks: false,
                    showLandmarkIconLabels: false,
                    showIndoorLabels: false,
                    theme: "monochrome"
                }
            },
            center: [-99.18717, 33.59513],
            zoom: 3.45,
            bearing: 0.00,
            pitch: 0.00,
        });

        map.on('load', () => {
            map.addSource('starlink-ix-pop', {
                type: 'geojson',
                // Use a URL for the value for the `data` property.
                data: 'starlink_pops_airports.geojson'
            });

            map.addLayer({
                'id': 'starlink-layer',
                type: 'symbol',
                source: 'starlink-ix-pop',
                layout: {
                    'icon-image': 'bus', // Use a Mapbox default icon or add a custom one
                    'icon-allow-overlap': true,
                    'text-field': ['get', 'title'] // Dynamically use the title from properties
                }
            });
        });
    </script>

</body>

</html>
